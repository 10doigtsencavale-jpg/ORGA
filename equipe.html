<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>ORGA · équipe</title>
<link rel="icon" type="image/png" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<script>
/* Fiche d'appli créée à l'ouverture : l'icône remplit tout le fond bleu sur Android,
   et le raccourci garde le lien complet (avec la clé), sinon il ouvrirait « Lien incomplet ». */
(function () { try {
  var base = location.href.split("#")[0].replace(/[^\/]*$/, ""), h = location.hash.slice(1).split(".")[0].slice(0, 24);
  var m = { name: "ORGA équipe · 10 Doigts en Cavale", short_name: "ORGA équipe", start_url: location.href, scope: base, id: base + "?app=equipe-" + encodeURIComponent(h),
    display: "standalone", background_color: "#2f3cff", theme_color: "#2f3cff", lang: "fr",
    icons: [{ src: base + "icon-192.png?v=2", sizes: "192x192", type: "image/png", purpose: "any" },
            { src: base + "icon-512.png?v=2", sizes: "512x512", type: "image/png", purpose: "any" },
            { src: base + "icon-maskable-512.png?v=2", sizes: "512x512", type: "image/png", purpose: "maskable" }] };
  var l = document.createElement("link"); l.rel = "manifest";
  l.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(m));
  document.head.appendChild(l);
} catch (e) {} })();
</script>
<meta name="apple-mobile-web-app-title" content="ORGA équipe">
<meta name="application-name" content="ORGA équipe">
<meta name="theme-color" content="#2e3bb2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Accueil réservé à l'équipe 10 Doigts en Cavale : tous les espaces organisateur au même endroit.
   Même charte que l'espace organisateur : Bebas Neue + DM Sans, bleu, moutarde, orange, turquoise.
   Liste rangée par étape (À envoyer, À vérifier, En attente de l'orga, Prêt). */
:root{
  --bg:#eef0fa; --card:#ffffff; --ink:#000; --mute:#555a70; --line:#ecedf5;
  --blue:#2e3bb2; --mus:#f7a42b; --ora:#f26b21; --turq:#87cabe; --turq2:#4fa597;
  --disp:'Bebas Neue',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  color-scheme:light;
}
/* Toujours en clair, comme les espaces organisateur. */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden}
button{font-family:inherit}
.bb{font-family:var(--disp);font-weight:400;letter-spacing:.02em;line-height:1;margin:0}
.in{padding-left:var(--gut);padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.in{padding-left:40px;padding-right:40px}}

/* En-tête */
.hero{position:relative;overflow:hidden;background:var(--blue);color:#fff;border-radius:0 0 28px 28px;padding-top:env(safe-area-inset-top,0px)}
.hero .d1{position:absolute;right:-60px;top:-90px;width:240px;height:240px;border-radius:50%;background:var(--mus)}
.hero .d2{position:absolute;right:240px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:var(--turq)}
.hero .d3{position:absolute;right:200px;top:24px;width:18px;height:18px;border-radius:50%;background:var(--ora)}
.hin{position:relative;display:flex;align-items:flex-end;gap:12px 24px;flex-wrap:wrap;padding-top:26px;padding-bottom:26px}
.htx{flex:1;min-width:0}
.kick{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.kick::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ora)}
.hero h1{font-size:clamp(44px,9vw,64px);margin-top:6px}
.tr{width:44px;height:5px;border-radius:3px;background:var(--ora);margin-top:6px}
.hact{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.maj{font-size:13px;font-weight:700;background:#2e3bb2;border-radius:999px;padding:6px 12px;position:relative}
.btnw{min-height:44px;border:0;border-radius:12px;background:#fff;color:var(--blue);font:700 14px var(--body);padding:0 16px;cursor:pointer}
@media (max-width:600px){
  .hero .d1{width:150px;height:150px;right:-60px;top:-70px}
  .hero .d2{width:60px;height:60px;right:110px;bottom:-30px}
  .hero .d3{right:100px;top:18px}
  .hin{padding-top:20px;padding-bottom:20px}
  .hact{width:100%;justify-content:space-between}
}

main .in{padding-top:20px;padding-bottom:40px;display:grid;gap:18px}

/* À voir aujourd'hui */
.today{background:#fff4e0;border-radius:16px;padding:12px 16px;display:grid;gap:4px}
.today h2{font-size:22px;color:#7a4300}
.today ul{margin:0;padding-left:18px;display:grid;gap:2px;font-size:14px}

/* Filtres = étapes */
.chips{display:flex;gap:8px;align-items:center}
.chips .sp{flex:1}
@media (max-width:899px){.chips{overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gut));padding:2px var(--gut)}.chips::-webkit-scrollbar{display:none}.chips .sp{flex:0 0 4px}}
.chip{display:inline-flex;gap:6px;align-items:center;flex:none;white-space:nowrap;min-height:40px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font:700 14px var(--body);border:1.5px solid var(--c,#d7daef);cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Étapes */
.stage{display:grid;gap:10px}
.sh{display:flex;align-items:center;gap:12px;background:var(--sb);color:var(--sf);border-radius:16px;padding:10px 16px}
.sh h2{font-size:26px;flex:1}
.sh .bb{font-size:26px}
.empty{margin:0 16px;font-size:14px;color:var(--mute)}
.st-send{--sb:#fde4d3;--sf:#9a3d00}.st-check{--sb:#e3e5f6;--sf:#2e3bb2}.st-wait{--sb:#fff4e0;--sf:#7a4300}.st-ready{--sb:#d6eeea;--sf:#1f6b5f}.st-past{--sb:#e4e6ef;--sf:#40455c}

/* Une ligne par événement */
.row{background:#fff;border-radius:18px;padding:14px 16px;display:grid;gap:12px 16px;align-items:center;min-width:0}
.row > *{min-width:0}
@media (min-width:900px){
  .row{grid-template-columns:minmax(220px,2fr) minmax(220px,2fr) 54px minmax(130px,1fr) minmax(170px,1.4fr) auto}
  .fl{display:none}
}
@media (max-width:899px){
  .row{grid-template-columns:1fr auto;grid-template-areas:"c r" "f f" "l l" "n n" "a a";border-radius:20px}
  .c-con{grid-area:c}.c-ring{grid-area:r;align-self:start}.c-fam{grid-area:f}.c-lnk{grid-area:l}.c-nxt{grid-area:n}.c-act{grid-area:a}
}
.past .row{opacity:.8}
.con{display:flex;gap:12px;align-items:center;min-width:0}
.date{width:48px;height:52px;border-radius:12px;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.date b{font-family:var(--disp);font-weight:400;font-size:24px}
.date span{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.ct{min-width:0;display:grid;gap:1px}
.ct strong{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.02;letter-spacing:.02em;overflow-wrap:anywhere}
.ct .w{font-size:13px;color:#333}
.ct .w b{font-weight:700;color:var(--blue)}
.ct small{font-size:12px;color:var(--mute)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.f-urg{background:#fde3bb;color:#7a4300}.f-tech{background:#fde4d3;color:#9a3d00}.f-logi{background:#e3e5f6;color:#2e3bb2}.f-com{background:#d6eeea;color:#1f6b5f}
.p-no{background:#fde4d3;color:#9a3d00}.p-info{background:#eef0fa;color:var(--blue)}.p-err{background:#b94a00;color:#fff}.p-ok{background:#d6eeea;color:#1f6b5f}
.wait{font-size:13px;color:var(--mute);font-style:italic}
.ring{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:conic-gradient(var(--blue) 0 var(--p),var(--line) var(--p))}
.ring span{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:15px;color:var(--blue)}
.ring.idle{background:var(--line)}
.lnk{display:grid;justify-items:start;gap:4px}
.lnk small{font-size:12px;color:var(--mute)}
.nxt{font-size:14px;display:grid;gap:2px;justify-items:start}
.nxt .k{font-size:12px;color:var(--mute)}
.nxt b.late{color:#b94a00}.nxt b.tod{color:#b46f00}
.nxt .nv{font-size:13px;font-weight:700;color:var(--blue)}
.act{display:flex;gap:6px;align-items:center;position:relative;justify-content:flex-end}
@media (max-width:899px){.act{justify-content:flex-start}.act .btn{flex:1;justify-content:center}}
.btn{min-height:42px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:700 14px var(--body);padding:0 16px;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.btn2{min-height:42px;min-width:44px;border:1.5px solid var(--blue);border-radius:12px;background:#fff;color:var(--blue);font:700 16px var(--body);padding:0 12px;cursor:pointer}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:15;background:#fff;border-radius:14px;box-shadow:0 14px 36px rgba(46,59,178,.22);padding:6px;display:grid;min-width:200px}
@media (max-width:899px){.menu{right:0;left:auto}}
.menu a,.menu button{font:600 14px var(--body);color:#000;background:none;border:0;border-radius:10px;padding:10px 12px;text-align:left;text-decoration:none;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--bg)}
.chip:focus-visible,.btn:focus-visible,.btn2:focus-visible,.btnw:focus-visible,.menu a:focus-visible,.menu button:focus-visible,.foot button:focus-visible,.lock button:focus-visible,.lock input:focus-visible{outline:3px solid var(--mus);outline-offset:2px}

/* Code équipe */
.lock{max-width:420px;width:100%;margin:6vh auto 0;background:#fff;border-radius:22px;padding:24px;display:grid;gap:12px;box-shadow:0 12px 32px rgba(46,59,178,.12)}
.lock h2{margin:0;font-family:var(--disp);font-weight:400;letter-spacing:.02em;font-size:32px;line-height:1;color:var(--blue)}
.lock p{margin:0;color:var(--mute)}
.lock form{display:flex;gap:8px;flex-wrap:wrap}
.lock input{font:inherit;font-size:18px;letter-spacing:.08em;flex:1;min-width:0;border:2px solid #d7daef;border-radius:12px;padding:10px 12px;background:#fff;color:#000}
.lock button{font:700 15px var(--body);border:0;border-radius:12px;min-height:46px;padding:0 18px;background:var(--blue);color:#fff;cursor:pointer}
.err{color:#b94a00;font-weight:700}
.foot{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:8px}
.foot button{font:inherit;color:var(--mute);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;color:#fff;font-weight:700;border-radius:999px;padding:10px 16px;z-index:20}
iframe.stat{position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none;left:-9999px}
</style>
</head>
<body>
<header class="hero"><span class="d1" aria-hidden="true"></span><span class="d2" aria-hidden="true"></span><span class="d3" aria-hidden="true"></span>
  <div class="hin in">
    <div class="htx"><div class="kick">Mougnou · Poloche</div><h1 class="bb">Nos événements</h1><div class="tr" aria-hidden="true"></div></div>
    <div class="hact"><span class="maj" id="maj"></span><button class="btnw" type="button" id="refresh" hidden>Actualiser</button></div>
  </div>
</header>
<main><div class="in" id="view"><p>Chargement…</p></div></main>
<div class="toast" id="toast" role="status" hidden></div>
<div id="frames" aria-hidden="true"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64u = x => Uint8Array.from(atob(x.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((x.length + 3) % 4)), c => c.charCodeAt(0));
const u64 = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let FID = "", SALT = null, BOX = null, DATA = null, STATS = {}, LASTSEEN = "";
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
function fail(msg) { $("#view").innerHTML = `<section class="lock"><h2>Accès impossible</h2><p>${esc(msg)}</p></section>`; }

/* Clé = PBKDF2(code équipe, sel = clé du lien). Le lien seul ne suffit pas ; le code est demandé une fois par appareil. */
async function derive(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim().toLowerCase()), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: SALT, iterations: 200000 }, base, 256);
}
async function openBox(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u(BOX.iv) }, key, b64u(BOX.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function lockHTML(err) {
  return `<section class="lock"><h2>Code équipe</h2>
    <p>Tapez votre code une seule fois. Il reste enregistré sur cet appareil.</p>
    <form id="codeF" autocomplete="off"><label for="code" class="sr" style="position:absolute;left:-9999px">Code équipe</label>
      <input id="code" name="code" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx" required>
      <button type="submit">Ouvrir</button></form>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}</section>`;
}
async function boot() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  const m = h.match(/^([A-Za-z0-9_-]{8,64})\.([A-Za-z0-9_-]{40,64})$/);
  if (!m) return fail("Ce lien est incomplet. Utilisez le lien équipe en entier.");
  FID = m[1]; SALT = b64u(m[2]);
  try { const r = await fetch("e/" + FID + ".json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw 0; BOX = await r.json(); }
  catch (e) { return fail("La liste des événements est introuvable pour le moment. Réessayez dans quelques minutes."); }
  const saved = store.get("orga-acc-" + FID);
  if (saved) { try { DATA = await openBox(b64u(saved)); return start(); } catch (e) { store.del("orga-acc-" + FID); } }
  $("#view").innerHTML = lockHTML(); $("#code").focus();
}
document.addEventListener("submit", async e => {
  if (e.target.id !== "codeF") return; e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "…";
  try { const raw = await derive($("#code").value); DATA = await openBox(raw); store.set("orga-acc-" + FID, u64(raw)); start(); }
  catch (err) { $("#view").innerHTML = lockHTML("Code incorrect."); $("#code").focus(); }
});

const ABR = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const dOf = e => e.iso ? new Date(e.iso + "T00:00:00") : null;
const fmt = d => { try { const x = new Date(d); return x.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) + " · " + x.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }).replace(":", "h"); } catch (e) { return ""; } };
const plur = (n, s) => n + " " + s + (n > 1 ? "s" : "");

/* Étapes : un événement à venir est dans une seule étape, la plus urgente. */
const STAGES = [
  { k: "send", nom: "À envoyer", c: "#f26b21", vide: "Aucun lien à envoyer." },
  { k: "check", nom: "À vérifier", c: "#2e3bb2", vide: "Aucune réponse à vérifier." },
  { k: "wait", nom: "En attente de l'orga", c: "#f7a42b", vide: "Aucun concert en attente." },
  { k: "ready", nom: "Prêt", c: "#4fa597", vide: "Aucun concert complet." }
];
const FAMS = [["urg", "À traiter vite"], ["tech", "Technique"], ["logi", "Accueil"], ["com", "Presse · après"]];
const isPause = e => /pause/i.test(e.statut || "");
function stageOf(e) {
  const s = STATS[e.fichier];
  if (!e.envoye && !isPause(e)) return "send";                 /* a. lien pas envoyé (et pas en pause) */
  if (s && (newOf(e).length || s.questions.length)) return "check"; /* b. nouveautés ou questions */
  if (s && s.n && s.d === s.n) return "ready";                /* c. tout est rempli */
  return "wait";                                              /* d. lien envoyé ou en pause, réponses manquantes */
}
let FILTER = store.get("orga-acc-filtre") || "all", SHOWPAST = false, MENU = "";
if (!["all", "send", "check", "wait", "ready"].includes(FILTER)) FILTER = "all";

function start() {
  LASTSEEN = store.get("orga-acc-seen-" + FID) || "";
  $("#refresh").hidden = false;
  $("#maj").textContent = DATA.maj ? "Mis à jour " + fmt(DATA.maj) : "";
  render();
  loadStats();
  setTimeout(() => store.set("orga-acc-seen-" + FID, new Date().toISOString()), 4000);
}
function loadStats() {
  STATS = {}; $("#frames").innerHTML = "";
  DATA.evenements.forEach((e, i) => {
    if (!e.lienEquipe) return;
    const u = new URL(e.lienEquipe, location.href); /* on ne garde que « #fichier.clé!code » : la page chargée est toujours la nôtre */
    if (!/^#[A-Za-z0-9_-]{8,64}\.[A-Za-z0-9_-]{40,64}![A-Za-z0-9_-]+$/.test(u.hash)) return;
    setTimeout(() => { const f = document.createElement("iframe"); f.className = "stat"; f.tabIndex = -1; f.title = "";
      f.src = "index.html" + u.hash; $("#frames").appendChild(f); }, i * 250);
  });
}
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== "orga-stats") return;
  STATS[e.data.fichier] = e.data; render();
});
function newOf(e) { const s = STATS[e.fichier]; return s ? s.journal.filter(j => (j.date || "") > LASTSEEN) : []; }

function rowHTML(e, past) {
  const d = dOf(e), days = d ? Math.round((d - today0()) / 864e5) : null, s = STATS[e.fichier];
  const pct = s && s.n ? Math.round(s.d / s.n * 100) : 0;
  const jx = days == null ? "" : days > 1 ? "J-" + days : days === 1 ? "Demain" : days === 0 ? "<b>Aujourd'hui</b>" : "Passé";
  const sub = [e.heure, e.chansigneurs].filter(Boolean).join(" · ");
  const con = `<div class="con"><span class="date">${d ? `<b>${d.getDate()}</b><span>${ABR[d.getMonth()]}</span>` : "<b>?</b>"}</span>
    <div class="ct"><strong>${esc(e.artiste || e.nom)}</strong><span class="w">${esc(e.lieu || e.ville || "")}${jx ? (e.lieu || e.ville ? " · " : "") + jx : ""}</span>${sub ? `<small>${esc(sub)}</small>` : ""}</div></div>`;
  let fam;
  if (!s) fam = e.erreur ? "" : `<span class="wait">calcul…</span>`;
  else if (s.fams) fam = `<div class="pills">${FAMS.filter(([k]) => s.fams[k] && s.fams[k].n).map(([k, l]) => { const f = s.fams[k], ok = f.d === f.n;
      return `<span class="pill f-${k}" title="${l} : ${f.d} sur ${f.n}" aria-label="${l} : ${f.d} sur ${f.n}${ok ? ", complet" : ""}">${ok ? "✓" : f.d + "/" + f.n}</span>`; }).join("")}</div>`;
  else fam = "";
  const ring = s ? `<span class="ring" style="--p:${pct}%" role="img" aria-label="${pct} % rempli (${s.d} sur ${s.n})"><span>${pct}%</span></span>`
    : `<span class="ring idle" role="img" aria-label="Calcul en cours"><span>…</span></span>`;
  const lk = [];
  if (isPause(e)) lk.push(`<span class="pill p-info">En pause</span>`);
  else if (!e.envoye) lk.push(`<span class="pill p-no">Lien pas envoyé</span>`);
  else lk.push(`<span class="pill p-info">Envoyé le ${esc(e.envoye)}</span>`);
  if (e.derniereRelance) lk.push(`<small>Relancé le ${esc(e.derniereRelance)}</small>`);
  if (e.erreur) lk.push(`<span class="pill p-err">${esc(e.erreur)}</span>`);
  const nx = [];
  if (s && !past) {
    if (s.late.length) nx.push(`<span class="k">Prochaine étape</span><b class="late">Date dépassée : ${esc(s.late.slice(0, 2).join(", "))}${s.late.length > 2 ? "…" : ""}</b>`);
    else if (s.next) nx.push(`<span class="k">Prochaine étape</span><b class="${s.next.days === 0 ? "tod" : ""}">${esc(s.next.label)} · ${s.next.days === 0 ? "aujourd'hui" : esc(s.next.dm)}</b>`);
    else if (s.n && s.d === s.n) nx.push(`<span class="k">Prochaine étape</span><b>Tout est rempli</b>`);
  }
  if (s) {
    const nv = newOf(e).length;
    if (nv) nx.push(`<span class="nv">${nv} nouvelle${nv > 1 ? "s" : ""} réponse${nv > 1 ? "s" : ""}</span>`);
    if (s.questions.length) nx.push(`<span class="nv" title="${esc(s.questions.join(", "))}">${plur(s.questions.length, "question")}</span>`);
    if (s.recus) nx.push(`<span class="pill p-ok">${s.recus} fichier${s.recus > 1 ? "s" : ""} reçu${s.recus > 1 ? "s" : ""}</span>`);
  }
  const more = [e.lienOrga ? `<button type="button" role="menuitem" data-copy="${esc(e.lienOrga)}">Copier le lien orga</button>` : "",
    e.fdr ? `<a role="menuitem" href="${esc(e.fdr)}" target="_blank" rel="noopener">FDR ↗</a>` : "",
    e.dropbox ? `<a role="menuitem" href="${esc(e.dropbox)}" target="_blank" rel="noopener">Dropbox ↗</a>` : ""].join("");
  const open = MENU === e.fichier;
  return `<article class="row">
    <div class="c-con">${con}</div>
    <div class="c-fam">${fam}</div>
    <div class="c-ring">${ring}</div>
    <div class="c-lnk lnk">${lk.join("")}</div>
    <div class="c-nxt nxt">${nx.join("")}</div>
    <div class="c-act act">${e.lienEquipe ? `<a class="btn" href="${esc(e.lienEquipe)}">Ouvrir</a>` : ""}
      ${more ? `<button type="button" class="btn2" data-menu="${esc(e.fichier)}" aria-label="Plus d'actions" aria-haspopup="menu" aria-expanded="${open}">⋯</button>
      ${open ? `<div class="menu" role="menu">${more}</div>` : ""}` : ""}</div>
  </article>`;
}
function render() {
  const evs = DATA.evenements, t0 = today0();
  const up = evs.filter(e => !dOf(e) || dOf(e) >= t0), past = evs.filter(e => dOf(e) && dOf(e) < t0).reverse();
  const items = [];
  evs.forEach(e => { const s = STATS[e.fichier]; if (!s) return; const n = e.artiste || e.nom;
    if (s.questions.length) items.push(`<b>${esc(n)}</b> : ${s.questions.length} question${s.questions.length > 1 ? "s" : ""} en attente`);
    const nv = newOf(e); if (nv.length) items.push(`<b>${esc(n)}</b> : ${nv.length} nouvelle${nv.length > 1 ? "s" : ""} réponse${nv.length > 1 ? "s" : ""}${nv[nv.length - 1].auteur ? " (" + esc(nv[nv.length - 1].auteur) + ")" : ""}`);
    if (s.late.length && dOf(e) >= t0) items.push(`<b>${esc(n)}</b> : date dépassée (${esc(s.late.join(", "))})`); });
  let html = items.length ? `<section class="today" aria-live="polite"><h2 class="bb">À voir aujourd'hui</h2><ul>${items.map(x => `<li>${x}</li>`).join("")}</ul></section>` : "";
  const by = {}; STAGES.forEach(g => by[g.k] = []);
  up.forEach(e => by[stageOf(e)].push(e));
  const chip = (k, txt, c) => `<button type="button" class="chip ${FILTER === k ? "on" : ""}" data-filter="${k}" aria-pressed="${FILTER === k}"${c ? ` style="--c:${c}"` : ""}>${txt}</button>`;
  html += `<div class="chips" role="group" aria-label="Étapes">${chip("all", `Tous · ${up.length}`)}${STAGES.map(g => chip(g.k, `${esc(g.nom)} · ${by[g.k].length}`, g.c)).join("")}<span class="sp"></span>
    ${past.length ? `<button type="button" class="chip ${SHOWPAST ? "on" : ""}" data-past aria-expanded="${SHOWPAST}">Terminés · ${past.length}</button>` : ""}</div>`;
  html += STAGES.filter(g => FILTER === "all" || FILTER === g.k).map(g => `<section class="stage st-${g.k}" aria-label="${esc(g.nom)}">
    <div class="sh"><h2 class="bb">${esc(g.nom)}</h2><span class="bb">${by[g.k].length}</span></div>
    ${by[g.k].length ? by[g.k].map(e => rowHTML(e, false)).join("") : `<p class="empty">${g.vide}</p>`}</section>`).join("");
  if (!up.length) html += `<p class="empty">Aucun événement à venir.</p>`;
  if (SHOWPAST && past.length) html += `<section class="stage st-past past" id="past" aria-label="Terminés"><div class="sh"><h2 class="bb">Terminés</h2><span class="bb">${past.length}</span></div>${past.map(e => rowHTML(e, true)).join("")}</section>`;
  html += `<div class="foot"><span>Réservé à l'équipe de 10 Doigts en Cavale. Ne transmettez jamais ce lien.</span><button type="button" id="forget">Oublier le code sur cet appareil</button></div>`;
  $("#view").innerHTML = html;
}
async function copy(t) {
  try { await navigator.clipboard.writeText(t); toast("Lien organisateur copié."); }
  catch (e) { const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); toast("Lien organisateur copié."); } catch (x) { toast("Copie impossible : ouvrez l'espace et copiez le lien."); } a.remove(); }
}
function setMenu(k, focus) {
  MENU = k; render();
  if (k && focus) { const m = document.querySelector(".menu a, .menu button"); if (m) m.focus(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("button, .menu a");
  if (MENU && !(b && (b.dataset.menu === MENU || b.closest(".menu")))) setMenu("");
  if (!b) return;
  if (b.dataset.copy) { copy(b.dataset.copy); setMenu(""); }
  else if (b.closest(".menu")) setMenu("");
  else if (b.dataset.menu) setMenu(MENU === b.dataset.menu ? "" : b.dataset.menu, true);
  else if (b.dataset.filter) { FILTER = (b.dataset.filter === FILTER && FILTER !== "all") ? "all" : b.dataset.filter; store.set("orga-acc-filtre", FILTER); render(); }
  else if (b.hasAttribute("data-past")) { SHOWPAST = !SHOWPAST; render(); if (SHOWPAST) { const p = $("#past"); if (p) p.scrollIntoView({ behavior: "smooth", block: "start" }); } }
  else if (b.id === "refresh") { location.reload(); }
  else if (b.id === "forget") { store.del("orga-acc-" + FID); toast("Code oublié sur cet appareil."); setTimeout(() => location.reload(), 900); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && MENU) { const k = MENU; setMenu(""); const t = document.querySelector(`[data-menu="${CSS.escape(k)}"]`); if (t) t.focus(); }
});
boot();
</script>
</body>
