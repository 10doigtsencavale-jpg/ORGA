<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Espace organisateur · 10 Doigts en Cavale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Piste A « Tuiles · Soleil » : bandeau bleu électrique + bloc jaune soleil avec l'artiste et la jauge,
   puis une grille de tuiles (un sujet = une tuile avec sa barre). Une tuile ouvre une vue dédiée.
   Univers volontairement clair et ensoleillé : un seul thème, couleurs fixées explicitement. */
:root{
  --electrique:#2f3cff; --soleil:#ffc629; --turquoise:#18c3b0; --encre:#10153d;
  --t-tech:#e2f7f4; --t-logi:#fff4d6; --t-pub:#e8eaff;
  --bg:#ffffff; --muted:#4f5677; --line:#e3e5f3; --soft:#f3f4fb;
  --ok:#14894e; --ok-bg:#dcf3e6; --sent-bg:#d4f3ee; --sent-fg:#0b6b5f; --todo-fg:#2f3cff; --todo-bg:#e8eaff;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--encre);font:16px/1.5 var(--body)}
[hidden]{display:none!important}
img{max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--electrique)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--electrique);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance}
.disp{font-family:var(--display);font-weight:600;letter-spacing:0;line-height:1.02}

.bar{height:10px;border-radius:999px;background:rgba(16,21,61,.12);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar .b-done{background:var(--electrique)} .bar.full .b-done{background:var(--ok)}

.topbar{background:var(--electrique);color:#fff}
.topbar .wrap{padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar img{height:40px;width:auto;display:block}
.chip{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--turquoise);color:#0b1a3a;padding:4px 10px;border-radius:999px}
.back{color:#fff;background:none;border:0;font:inherit;font-weight:700;cursor:pointer;padding:8px 0;min-height:44px}
.sun{background:var(--soleil)}
.sun .wrap{padding-block:20px 22px;display:grid;gap:6px}
.artist{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.artist h1{margin:0;font-size:clamp(50px,13vw,78px)}
.cs-logo{width:68px;height:68px;flex:none}
.where{font-weight:700;font-size:18px}
.gauge{margin-top:10px;background:#fff;border-radius:16px;padding:12px 14px;display:grid;gap:8px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gauge-top strong{font-size:22px}
.gauge-top span{font-weight:700;font-variant-numeric:tabular-nums}
.gauge p{margin:0;font-size:15px}

.preview{background:#fff4d6;color:#5b3a00;font-size:14px;border-bottom:1px solid #f0dca6}
.preview .wrap{max-width:980px;padding-block:8px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.seg{display:inline-flex;border:1px solid currentColor;border-radius:8px;overflow:hidden;margin-left:4px;vertical-align:middle}
.seg button{font:inherit;font-size:14px;font-weight:700;background:transparent;color:inherit;border:0;padding:6px 10px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#5b3a00;color:#fff4d6}

main .wrap{padding-block:18px 28px;display:grid;gap:16px}

.team{border:2px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px}
.team h2{margin:0;font-size:22px}
.arr{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.arr li{display:grid;grid-template-columns:7.6em 1fr;gap:10px;font-size:15px}
.arr .t{font-weight:700;font-variant-numeric:tabular-nums}
.contact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:2px dashed var(--line);padding-top:10px}

.tiles-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tiles-h h2{margin:0;font-size:28px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{font:inherit;color:inherit;text-align:left;cursor:pointer;border:2px solid transparent;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:140px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px -16px rgba(16,21,61,.6)}
.tile.g-tech{background:var(--t-tech)} .tile.g-logi{background:var(--t-logi)} .tile.g-pub{background:var(--t-pub)}
.tile.done{border-color:var(--ok)}
.tile .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center}
.tile .lb{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.2;flex-grow:1}
.tile .ct{font-size:12px;font-weight:700}
.tile.done .ct{color:var(--ok)}
.fdr{border-radius:18px;background:var(--turquoise);color:#0b1a3a;padding:18px;display:grid;gap:10px}
.fdr h2{margin:0;font-size:26px}
.fdr p{margin:0}

.band .wrap{padding-block:18px;display:grid;gap:8px}
.band.g-tech{background:var(--turquoise);color:#0b1a3a}
.band.g-logi{background:var(--soleil);color:var(--encre)}
.band.g-pub{background:var(--electrique);color:#fff}
.band.g-pub .bar{background:rgba(255,255,255,.3)} .band.g-pub .bar .b-done{background:#fff}
.band.g-tech .bar,.band.g-logi .bar{background:rgba(255,255,255,.55)}
.band .ev{font-size:13px;font-weight:700}
.band h1{margin:0;font-size:clamp(32px,8.5vw,46px)}
.band .meta{font-size:14px;font-weight:700;opacity:.9}
.progress-row{display:flex;align-items:center;gap:10px}
.progress-row .bar{flex-grow:1}
.progress-row span{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}

.topic{display:grid;gap:18px}
.needs{display:grid;gap:8px}
.needs h2{margin:0;font-size:17px}
.needs ul{margin:0;padding-left:20px;display:grid;gap:6px}
.important{border-radius:14px;background:#fff1d1;padding:12px 14px;display:grid;gap:4px}
.important strong{font-family:var(--display);font-weight:600;font-size:18px;color:#8a3d00}
.blk{border-top:2px dashed var(--line);padding-top:16px;display:grid;gap:12px}
.blk h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px;color:var(--electrique)}
.team-h{font-weight:700}

.item{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;transition:background .3s,border-color .3s}
.item.is-done{background:var(--soft);border-color:transparent}
.item-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-h .lbl{font-weight:700;min-width:0}
.det{margin:0;color:var(--muted);font-size:15px;white-space:pre-line}
.val{margin:0;font-size:15px;white-space:pre-line;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.byteam{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-todo{background:var(--todo-bg);color:var(--todo-fg)} .p-sent{background:var(--sent-bg);color:var(--sent-fg)}

.form{display:grid;gap:8px}
label.small{font-size:14px;color:var(--muted)}
textarea,input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--encre);background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus{border-color:var(--electrique);outline:none}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:999px;padding:11px 18px;min-height:46px;cursor:pointer;border:2px solid transparent;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--electrique);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-big{font-size:17px;min-height:54px;padding:14px 22px}
.btn-dark{background:var(--encre);color:#fff}
.btn-ghost{background:#fff;color:var(--encre);border-color:#d6d9ec}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--encre);text-decoration:none;border:2px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff}
.doc:hover{border-color:var(--electrique)}
.doc small{font-weight:400;color:var(--muted)}
.fwd{border-radius:14px;background:var(--soft);padding:12px 14px;display:grid;gap:8px;font-size:15px}
.admin{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.admin select{font:inherit;font-size:15px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-height:46px;background:#fff;color:var(--encre)}

.clist{display:grid;gap:8px}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;border:2px solid transparent;background:var(--soft);border-radius:14px;padding:10px 12px;align-items:center}
.crow .r{font-weight:700} .crow .v{grid-column:1/-1;color:var(--muted);font-size:14px}

footer{color:var(--muted);font-size:14px}
footer .wrap{padding-block:0 32px;display:grid;gap:4px}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.bravo{position:fixed;inset:0;display:grid;place-items:center;z-index:31;pointer-events:none}
.bravo div{font-family:var(--display);font-weight:600;font-size:clamp(48px,13vw,96px);line-height:1;color:var(--encre);background:var(--soleil);padding:18px 30px;border-radius:24px;text-align:center;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);animation:pop 2s cubic-bezier(.2,.9,.3,1.2) forwards;max-width:calc(100% - 32px)}
.bravo small{display:block;font-family:var(--body);font-size:16px;font-weight:700;letter-spacing:0;margin-top:8px;color:var(--electrique)}
@keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}18%{transform:scale(1.06) rotate(1deg);opacity:1}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--encre);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;z-index:32;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation-duration:.01s!important}}
@media (max-width:400px){.arr li{grid-template-columns:1fr;gap:0}}
.or{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
@media (max-width:620px){.or{grid-template-columns:1fr}.or-badge{justify-self:center}}
.or-badge{align-self:center;font-family:var(--display);font-weight:600;font-size:20px;background:var(--soleil);color:var(--encre);border-radius:999px;width:56px;height:56px;display:grid;place-items:center}
.side{border:2px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:10px;align-content:start;transition:opacity .3s,filter .3s}
.side.is-done{border-color:var(--ok);background:#f4fbf7}
.side.is-off{opacity:.45;filter:grayscale(1);background:var(--soft)}
.side-h{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.cf{display:grid;gap:6px}
.cf .lbl{font-weight:700;font-size:15px}
.cf.off input{background:var(--soft)}
.grp{display:grid;gap:10px}
.grp h3{margin:0}
.choice .box{width:20px;height:20px;border:2px solid var(--electrique);border-radius:6px;display:inline-block}
.choice:hover .box{background:var(--todo-bg)}
.alerte{display:flex;gap:14px;align-items:flex-start;background:var(--electrique);color:#fff;border-radius:18px;padding:16px;text-align:left;font:inherit;border:0;width:100%}
.alerte strong{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;display:block}
.alerte p{margin:4px 0 0;line-height:1.45}
.alerte-btn{cursor:pointer}
.al-ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--soleil);color:var(--encre);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:24px}
.setlist{display:grid;gap:8px;background:var(--t-logi);border-radius:16px;padding:14px 16px}
.setlist h2{margin:0;font-size:17px}
.setlist ol{margin:0;padding-left:24px;columns:2;column-gap:20px;font-size:15px;line-height:1.6}
@media (max-width:420px){.setlist ol{columns:1}}
.feed{border-radius:18px;background:var(--t-pub);padding:14px 16px;display:grid;gap:8px}
.feed h2{margin:0;font-size:22px}
.feed ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.nv{font:inherit;color:inherit;text-align:left;width:100%;background:#fff;border:0;border-radius:12px;padding:10px 12px;display:grid;gap:4px;cursor:pointer}
.nv:hover{box-shadow:0 0 0 2px var(--electrique) inset}
.nv-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;font-weight:700}
.nv-who{padding:2px 8px;border-radius:999px}
.w-orga{background:var(--soleil);color:var(--encre)} .w-10dec{background:var(--electrique);color:#fff}
.nv-q{padding:2px 8px;border-radius:999px;background:var(--turquoise);color:#0b1a3a}
.nv-new{padding:2px 8px;border-radius:999px;background:var(--encre);color:#fff}
.nv-d{color:var(--muted);margin-left:auto;font-weight:600}
.nv-t{font-size:14px;line-height:1.4}
/* ===== Design « Blocs colorés » + encadré « À faire en priorité » =====
   Trois familles : Technique (turquoise), Accueil · VHR (jaune), Public sourd · com (bleu). Vert = validé. */
body{background:#f4f5fa}
body::before{background:#ffffff}
.topbar{background:#ffffff;color:var(--encre);border-bottom:1px solid #e8eaf3}
.topbar .wrap{max-width:980px}
.topbar .logo-chip{background:var(--electrique);border-radius:12px;padding:6px 10px;display:inline-flex}
.topbar .logo-chip img{height:30px}
.topbar .eo{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--electrique)}
.ct-ev{font-size:clamp(18px,4.5vw,24px)}
.ct-n{font-weight:800;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:14px}
.wrap.bhome{max-width:980px}
.bcard{position:relative;overflow:hidden;background:var(--electrique);color:#fff;border-radius:22px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.bcard::before,.bcard::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.bcard::before{right:-40px;top:-40px;width:150px;height:150px;background:var(--soleil)}
.bcard::after{right:90px;bottom:-50px;width:90px;height:90px;background:var(--turquoise)}
.bcard>*{position:relative;z-index:1}
.bcard .bc-main{display:grid;gap:6px;min-width:0}
.bcard .artist h1{font-size:clamp(44px,9vw,70px)}
.bcard .cs-logo{background:#fff;border-radius:14px;padding:3px;width:56px;height:56px}
.bcard .where{font-weight:800;font-size:17px}
.bcard .sub{font-size:15px;opacity:.95}
.bcard .pct{background:#fff;color:var(--encre);border-radius:18px;padding:10px 14px;text-align:center;align-self:center}
.bcard .pct b{display:block;font-family:var(--display);font-weight:600;font-size:32px;line-height:1}
.bcard .pct span{font-size:12px;font-weight:800}
.bcard .msg{margin:0;grid-column:1/-1;font-weight:700}
@media (max-width:520px){.bcard{grid-template-columns:1fr}.bcard .pct{justify-self:start;display:flex;gap:8px;align-items:baseline}}
.prio{background:#fff4e8;border:2px solid #ff8a2a;border-radius:18px;padding:14px 16px;display:grid;gap:8px}
.prio-h{display:flex;align-items:center;gap:8px}
.prio-h h2{margin:0;font-size:22px}
.prio-h small{margin-left:auto;font-size:13px;font-weight:800;color:#a34a08}
.prio-i{font:inherit;color:var(--encre);text-align:left;cursor:pointer;background:#fff;border:0;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;transition:transform .15s}
.prio-i:hover{transform:translateX(3px)}
.prio-i .pe{font-size:18px}
.prio-i .pt{flex-grow:1;display:grid;line-height:1.3}
.prio-i .pt b{font-size:15px}
.prio-i .pt span{font-size:13px;color:var(--muted)}
.due{font-size:12px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#ffe9a8;color:#6b4a00}
.due.urg{background:#ff8a2a;color:#fff}
.due.late{background:#c2410c;color:#fff}
.prio-i .pa{color:#ff8a2a;font-weight:800;font-size:20px}
.fam{display:grid;gap:8px}
.fam-l{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.roles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.roles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.role{font:inherit;color:var(--encre);text-align:left;cursor:pointer;border:0;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .15s,box-shadow .15s}
.role:hover{transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(16,21,61,.6)}
.role-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.role-e{font-size:26px;line-height:1}
.role-n{font-family:var(--display);font-weight:600;font-size:19px}
.role-l{font-weight:800;font-size:15px;line-height:1.2;flex-grow:1}
.role .bar{background:rgba(255,255,255,.85);height:7px}
.role.full{box-shadow:0 0 0 3px var(--ok) inset}
.role.full .role-n{color:var(--ok)}
.ball{font:inherit;font-weight:800;color:var(--electrique);background:none;border:0;text-align:left;cursor:pointer;padding:6px 0;justify-self:start}
.bout{background:#fff;border-radius:18px;padding:16px;display:grid;gap:10px;color:var(--encre)}
.bout h2{margin:0;font-size:24px}
.bout .arr .t{color:var(--electrique)}
.btn-turq{background:var(--turquoise);color:#0b1a3a}
.feed{background:#fff}
.tabs{background:#fff;border-bottom:1px solid #e8eaf3;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs-in{max-width:980px;margin:0 auto;display:flex;gap:6px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
@media (min-width:900px){.tabs-in{flex-wrap:wrap;overflow:visible}}
.tab{flex:none;font:inherit;font-size:14px;font-weight:800;background:#f1f2f8;color:var(--encre);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;min-height:36px}
.tab small{font-size:12px;opacity:.75;font-weight:700}
.tab.full:not(.cur) small{color:var(--ok);opacity:1}
.wrap.topic{max-width:760px}
.thb{border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.thb .te{font-size:40px;line-height:1}
.thb .tm{flex-grow:1;display:grid;gap:8px;min-width:0}
.thb h1{margin:0;font-size:clamp(28px,6vw,40px)}
.thb .bar{background:#fff;height:9px}
.thb .progress-row span{font-weight:800}
.dl{background:var(--soleil);border-radius:14px;padding:6px 10px;font-size:12px;font-weight:800;text-align:center;line-height:1.2;flex:none}
.dl b{display:block;font-family:var(--display);font-weight:600;font-size:18px}
.dl.urg{background:#ff8a2a;color:#fff}
.dl.late{background:#c2410c;color:#fff}
.pour{margin:0;color:var(--muted);font-weight:700}
.hint{margin:0;color:var(--muted)}
.chks,.items{display:grid;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;border:2px solid transparent;background:#fff;border-radius:14px;padding:12px 14px;line-height:1.4;cursor:pointer;transition:background .2s,border-color .2s}
.chk:hover{border-color:#18c3b0}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:#12a596;flex:none;cursor:pointer}
.chk-t{display:grid;gap:2px}
.chk-t>span{color:var(--muted);font-size:14px}
.chk.on{background:#e3f7f4}
.chk.imp:not(.on){background:#fff4e8;border-color:#ffc89a}
.tag-imp{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:#ff8a2a;color:#fff;padding:2px 7px;border-radius:999px;margin-right:6px;vertical-align:2px}
.chk-t>span.chk-r{color:var(--ok);font-weight:700}
.qui{background:#fff4d6;border-radius:16px;padding:14px;display:grid;gap:10px}
.qui .side{background:#fff}
.qui .or-badge{background:var(--encre);color:var(--soleil)}
.qui .cf{background:#fff;border-radius:14px;padding:12px 14px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{cursor:pointer}
.pk input{position:absolute;opacity:0;pointer-events:none}
.pk span{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:15px;border:2px solid #d6d9ec;border-radius:999px;padding:8px 14px;background:#fff}
.pk span::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #9aa0bd;box-sizing:border-box}
.pk input:checked+span{border-color:var(--electrique);background:#eef0ff;color:var(--electrique)}
.pk input:checked+span::before{border:5px solid var(--electrique)}
.pk input:focus-visible+span{outline:3px solid var(--electrique);outline-offset:2px}
.qui .grp h3{margin:0;font-family:var(--display);font-weight:600;font-size:20px;color:var(--encre)}
.btn-line{background:#eef0ff;color:var(--electrique);border-color:#eef0ff}
.fwd2{margin:0;color:var(--muted)}
.linkbtn{font:inherit;color:var(--electrique);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.tnav{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;border-top:2px dashed var(--line);padding-top:16px}
.intro{margin:0;font-size:16px}
@media (min-width:900px){body{font-size:17px}.chk-t>span{font-size:15px}}
</style>
</head>

function dueOf(t) {
  if (!t.iso) return null;
  const d = new Date(t.iso + "T00:00:00"), days = Math.round((d - today0()) / 864e5);
  const dm = d.toLocaleDateString("fr-FR", { day: "numeric", month: "numeric" });

function mergeServer() {
  Object.entries(EVENT.reponses || {}).forEach(([id, r]) => {

      const cur = sent[id]; if (cur && (cur.date || "") >= r.date) return;
      if (String(r.texte || "").startsWith("✗")) { delete sent[id]; return; }
      const p = allPoints().find(x => x.id === id) || EVENT.topics.filter(t => t.confirm).map(confirmItem).find(x => x.id === id);

      if (p && p.type === "ouinon" && r.texte === p.oui) extra.oui = true;
      if (p && p.type === "choix") { const o = p.options.find(o => o.texte === r.texte); if (o && o.fichier) extra.fichier = o.fichier; }
      sent[id] = Object.assign({ texte: r.texte, date: r.date, srv: true }, extra);

  return Object.assign({ id: cid, titre: c.role, statut: c.statut, type: c.statut === "ok" ? "info" : "contact", valeur: c.valeur }, extra || {});
}
function confirmItem(t) {
  return { id: t.confirm.id, titre: "Besoins confirmés par l'organisateur", statut: "todo", type: "confirm-big", label: t.confirm.label, nonConcerne: t.confirm.nonConcerne };
}
const contactDone = cid => { const c = contactItem(cid); return statusOf(c) !== "todo"; };
const sideDone = list => list.length > 0 && list.every(contactDone);
/* « Qui gère… ? » : une question par rôle, réponse « Équipe du festival · Nom, tél, mail ». */
const SIDES = { festival: "Équipe du festival", artiste: "Équipe de l'artiste" };
const groupDone = gk => EVENT.groups[gk].roles.every(r => contactDone(r.c));
function contactValue(cid) { const t = sent["team-" + cid], r = sent[cid], c = EVENT.contacts[cid] || {}; return (t && t.texte) || (r && r.texte) || c.valeur || ""; }
function sideOf(cid) { const v = contactValue(cid); if (v.startsWith(SIDES.artiste)) return "artiste"; if (v.startsWith(SIDES.festival)) return "festival"; return (EVENT.contacts[cid] || {}).equipe || ""; }
function groupItem(gk) { const g = EVENT.groups[gk]; return { id: "grp-" + gk, titre: g.titre, type: "group", group: gk, statut: "todo" }; }
function itemOf(it) { return it.contact ? contactItem(it.contact, { detail: it.detail }) : it; }
/* Les besoins techniques deviennent des cases à cocher, une par besoin (+ la case « Important »). */
const asB = b => typeof b === "string" ? { t: b, d: "" } : (b || { t: "", d: "" });
function checksOf(t) {
  const out = (t.besoins || []).map((b, i) => { const x = asB(b); return { id: t.id + "-b" + i, titre: x.t, detail: x.d, type: "check", statut: "todo" }; });
  if (t.important && !t.importantTop) { const x = asB(t.important); out.push({ id: t.id + "-imp", titre: x.t, detail: x.d, type: "check", statut: "todo", important: true }); }
  return out;
}
/* Les « points » d'un sujet : ses cases, ses items, son « Qui gère… ? » (un seul point : festival OU artiste). */
function pointsOf(t) {
  const pts = [...checksOf(t), ...(t.items || []).map(itemOf)];
  if (t.confirm && !t.besoins) pts.push(confirmItem(t));
  if (t.qui) pts.push(groupItem(t.qui));
  (t.contactsList || []).forEach(e => pts.push(e.startsWith("g:") ? groupItem(e.slice(2)) : contactItem(e)));
  return pts;
}
const allPoints = () => { const m = new Map(); EVENT.topics.forEach(t => pointsOf(t).forEach(p => m.set(p.id, p))); return [...m.values()]; };
function statusOf(p) {
  if (p.type === "group") return groupDone(p.group) ? "ok" : "todo";
  const t = sent["team-" + p.id]; if (t) return t.statut;
  if (p.statut === "todo" && sent[p.id]) return "sent";
  return p.statut === "info" ? "ok" : p.statut;
}
const isDone = p => statusOf(p) !== "todo";
function progress(points) { const d = points.filter(isDone).length; return { d, n: points.length, full: points.length > 0 && d === points.length }; }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, 2800); }
async function copy(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) { toast("La copie automatique n'a pas fonctionné. Sélectionnez le texte à la main."); }
}

/* ===== Confettis ===== */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const CONF = ["#2f3cff", "#18c3b0", "#ffc629", "#ff8a1f", "#ffffff"];
let parts = [], raf = 0;
function burst(x, y, n, spread) {
  if (REDUCED) return;
  const c = $("#confetti"); c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * spread, v = 6 + Math.random() * 9;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, c: CONF[i % CONF.length], life: 0 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  const c = $("#confetti"), g = c.getContext("2d"), k = devicePixelRatio;
  if (!g) { parts = []; raf = 0; return; }
  g.clearRect(0, 0, c.width, c.height);
  parts = parts.filter(p => p.life < 140 && p.y < innerHeight + 40);
  for (const p of parts) {
    p.life++; p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    g.save(); g.translate(p.x * k, p.y * k); g.rotate(p.r); g.globalAlpha = Math.max(0, 1 - p.life / 140);
    g.fillStyle = p.c; g.fillRect(-p.w * k / 2, -p.h * k / 2, p.w * k, p.h * k); g.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
}
function bravo(titre, sous) {
  const d = document.createElement("div"); d.className = "bravo";
  d.innerHTML = `<div>${esc(titre)}<small>${esc(sous)}</small></div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2100);
  for (let i = 0; i < 3; i++) setTimeout(() => burst(innerWidth * (.2 + .3 * i), innerHeight * .55, 70, 1.6), i * 180);
}

/* ===== Réponses ===== */

/* ===== Feuille de route PDF ===== */
const pdfSafe = s => String(s ?? "").replace(/œ/g, "oe").replace(/Œ/g, "OE").replace(/[→]/g, "->").replace(/[–—]/g, "-").replace(/[’]/g, "'").replace(/[«»]/g, '"').replace(/×/g, "x").replace(/…/g, "...").replace(/[^\x00-\xFF]/g, "");
function buildPdf() {

  const W = 210, M = 16; let y = 0;
  const BLEU = [47, 60, 255], SOLEIL = [255, 198, 41], TURQ = [24, 195, 176], GRIS = [79, 86, 119];
  const need = h => { if (y + h > 282) { doc.addPage(); y = 18; } };
  const text = (t, size, style, color, indent) => {
    doc.setFont("helvetica", style || "normal"); doc.setFontSize(size); doc.setTextColor(...(color || [16, 21, 61]));
    doc.splitTextToSize(pdfSafe(t), W - 2 * M - (indent || 0)).forEach(l => { need(size * .45); doc.text(l, M + (indent || 0), y); y += size * .45; });
  };
  doc.setFillColor(...BLEU); doc.rect(0, 0, W, 12, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.text("10 DOIGTS EN CAVALE - FEUILLE DE ROUTE", M, 8);
  doc.setFillColor(...SOLEIL); doc.rect(0, 12, W, 30, "F");
  doc.setTextColor(16, 21, 61); doc.setFontSize(26); doc.text(pdfSafe(EVENT.artiste.toUpperCase()), M, 27);
  doc.setFont("helvetica", "normal"); doc.setFontSize(11);
  doc.text(pdfSafe(`${EVENT.lieu}, ${EVENT.ville} - ${EVENT.date} - ${EVENT.heure} - Première partie : ${EVENT.premiere}`), M, 36);
  y = 52;
  const h2 = t => { need(14); y += 3; doc.setFillColor(...TURQ); doc.rect(M, y - 5.5, W - 2 * M, 8, "F"); text(t.toUpperCase(), 12, "bold", [11, 26, 58], 2); y += 2; };
  const r = EVENT.referente;
  h2(`Les chansigneurs : ${EVENT.chansigneurs}`);
  text(`Contact : ${r.nom} - ${r.tel} - ${r.mail}`, 10.5, "bold");
  EVENT.arrivees.forEach(a => text(`${a.quand} - ${a.detail}`, 10.5));
  const ans = p => { const t = sent["team-" + p.id], s = sent[p.id]; return (t && t.texte) || (s && s.texte) || p.valeur || ""; };
  EVENT.topics.forEach(t => {
    h2(t.label);
    if (t.important && t.importantTop) text(`Important : ${asB(t.important).t}`, 10, "bold", null, 2);
    pointsOf(t).forEach(p => {
      const etat = statusOf(p) === "todo" ? " [à compléter]" : "";
      if (p.type === "group") {
        const g = EVENT.groups[p.group]; text(`${p.titre}${etat}`, 10.5, "bold", BLEU, 2);
        g.roles.forEach(r => { const v = contactValue(r.c); if (v) text(`${r.q} ${v}`, 10, "normal", null, 6); });
        y += .8; return;
      }
      text(`${p.titre}${p.type === "check" && p.detail ? " - " + p.detail : ""}${etat}`, 10.5, "bold", BLEU, 2);
      const v = ans(p); if (v) text(v, 10, "normal", null, 6);
      y += .8;
    });
    const q = sent["q-" + t.id]; if (q) text(`Question de l'organisateur : ${q.texte}`, 10, "italic", GRIS, 2);
  });
  need(10); y += 4; text(`Document généré le ${new Date().toLocaleDateString("fr-FR")} depuis l'espace organisateur 10 Doigts en Cavale.`, 8.5, "italic", GRIS);
  return doc;
}
async function downloadPdf() {
  if (!window.jspdf) { toast("Le module PDF n'a pas pu se charger. Réessayez dans un instant."); return; }
  const doc = buildPdf(); const name = `Feuille de route - ${EVENT.artiste} - ${EVENT.lieu}.pdf`;
  try {
    const dl = window.claude && claude.use ? await claude.use("downloads") : null;
    if (dl) { await dl.save({ filename: name, data: doc.output("blob") }); return; }
  } catch (err) { if (err && err.code === "declined") return; }

  const full = decodeURIComponent((location.hash || "").slice(1)).split("~")[0];
  const [h, code] = full.split("!");
  const m = h.match(/^([A-Za-z0-9_-]{8,64})\.([A-Za-z0-9_-]{40,64})$/);
  if (!m) return fail("Ce lien ne permet pas d'ouvrir un événement. Merci d'utiliser le lien reçu par mail, en entier.");
  TOKEN = h; FILEID = m[1]; LS = "orga-" + m[1];
  try {
    const r = await fetch("e/" + m[1] + ".json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("introuvable");
    const box = await r.json();
    const key = await crypto.subtle.importKey("raw", b64u(m[2]), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64u(box.iv) }, key, b64u(box.ct));
    EVENT = JSON.parse(new TextDecoder().decode(plain));
  } catch (err) { return fail("Cet événement n'a pas pu être ouvert. Le lien est peut-être incomplet ou n'est plus actif."); }
  document.title = `${EVENT.artiste} · ${EVENT.lieu} · Espace organisateur`;
  if (code && EVENT.adminHash) {
    const dg = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(code));
    if ([...new Uint8Array(dg)].map(b => b.toString(16).padStart(2, "0")).join("") === EVENT.adminHash) { ADMIN = true; ADMINPART = "!" + code; }
  }
  loadLocal(); mergeServer();
  const t0 = topicFromHash(); CURRENT = EVENT.topics.some(t => t.id === t0) ? t0 : null;
  render(false);
})();
</script>
